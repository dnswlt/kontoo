<!DOCTYPE html>
<html lang="en">

<head>
    {{template "head_common.html"}}
</head>

<body id="calc-page">
    {{template "nav.html" .}}
    <main class="page-content">
    <h1>Calculator</h1>
    <div id="status-callout" class="callout hidden" role="status" aria-live="polite"></div>
    <h2 class="section-heading">Internal rate of return (IRR)</h2>
    <form id="irr-form" class="edit-form" autocomplete="off">
        <div class="field">
            <div class="field-label">
                <label for="NominalValue">Nominal value</label>
            </div>
            <div class="field-value">
                <input id="NominalValue" name="NominalValue" type="text" class="micros" value="10000" required>
            </div>
        </div>
        <div class="field">
            <div class="field-label">
                <label for="PurchasePrice">Purchase price</label>
            </div>
            <div class="field-value">
                <input id="PurchasePrice" name="PurchasePrice" type="text" class="micros" value="100%" required>
            </div>
        </div>
        <div class="field">
            <div class="field-label">
                <label for="Cost">Cost</label>
            </div>
            <div class="field-value">
                <input id="Cost" name="Cost" type="text" class="micros" value="0" required>
            </div>
        </div>
        <div class="field">
            <div class="field-label">
                <label for="PurchaseDate">Purchase date</label>
            </div>
            <div class="field-value">
                <input id="PurchaseDate" name="PurchaseDate" type="text" value="{{.Today}}" class="datepicker" required>
            </div>
        </div>
        <div class="field">
            <div class="field-label">
                <label for="MaturityDate">Maturity date</label>
            </div>
            <div class="field-value">
                <input id="MaturityDate" name="MaturityDate" type="text" value="{{.DefaultMaturity}}" class="datepicker" required>
            </div>
        </div>
        <div class="field">
            <div class="field-label">
                <label for="InterestRate">Interest rate</label>
            </div>
            <div class="field-value">
                <input id="InterestRate" name="InterestRate" type="text" value="2%" pattern="\d+(\.\d+)?%?" required>
            </div>
        </div>
        <div class="form-actions">
            <button class="form-save" type="submit">Calculate</button>
        </div>
        <div class="field">
            <div class="field-label">
                <label for="IRR">Internal rate of return</label>
            </div>
            <output id="IRR" class="calc-result" for="NominalValue PurchasePrice Cost PurchaseDate MaturityDate InterestRate">–</output>
        </div>
    </form>
    </main>
</body>

</html>
